<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO 優化 -->
    <meta name="description" content="用瀏覽器就能玩的經典踩地雷，支援初級/中級/高級難度，左鍵翻開、右鍵插旗與數字快速展開。">
    <meta property="og:title" content="踩地雷 | Arcade">
    <meta property="og:description" content="Rowan Tsai 休憩區內建的網頁版踩地雷小遊戲。">
    <meta property="og:image" content="images/profile.jpg">
    <link rel="canonical" href="https://junrongtsai.github.io/minesweeper.html">

    <title>踩地雷 | Arcade</title>

    <meta name="theme-color" content="#0d1117">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='34' fill='%2358a6ff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入獨立的 CSS (共用主站變數系統) -->
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; user-select: none; }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-shell {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 12px;
            max-width: 100%;
        }

        /* --- 難度選擇 --- */
        .difficulty { display: flex; gap: 8px; }
        .diff-btn {
            background: rgba(255,255,255,0.06);
            border: 1px solid var(--border);
            color: var(--text-muted);
            padding: 6px 16px;
            border-radius: 6px;
            font-size: 0.9rem;
            font-family: inherit;
            cursor: pointer;
            transition: 0.15s;
        }
        .diff-btn:hover { color: var(--text-main); border-color: var(--accent); }
        .diff-btn.active {
            background: var(--accent);
            border-color: var(--accent);
            color: #0d1117;
            font-weight: bold;
        }

        /* --- 狀態列 --- */
        .status-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 20px;
            width: 100%;
            background: var(--bg-color);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 8px 14px;
        }
        .counter {
            font-size: 1.1rem;
            font-weight: bold;
            font-variant-numeric: tabular-nums;
            color: var(--accent);
            min-width: 76px;
        }
        .counter i { color: var(--text-muted); font-size: 0.9rem; margin-right: 4px; }
        .counter.right { text-align: right; }
        .reset-btn {
            background: rgba(255,255,255,0.08);
            border: 1px solid var(--border);
            border-radius: 8px;
            font-size: 1.3rem;
            line-height: 1;
            padding: 4px 10px;
            cursor: pointer;
            transition: 0.15s;
        }
        .reset-btn:hover { border-color: var(--accent); background: rgba(88,166,255,0.15); }

        /* --- 盤面 --- */
        #board-wrap { position: relative; max-width: 100%; overflow-x: auto; overflow-y: hidden; }
        #board {
            display: grid;
            gap: 1px;
            background: var(--border);
            border: 2px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 0 25px rgba(88, 166, 255, 0.12);
            touch-action: manipulation;
        }
        #board.paused { filter: blur(7px); pointer-events: none; }

        .cell {
            width: var(--cell);
            height: var(--cell);
            background: #1c2430;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: calc(var(--cell) * 0.55);
            font-weight: bold;
            line-height: 1;
            cursor: pointer;
        }
        .cell:hover:not(.revealed) { background: #26313f; }
        .cell.revealed { background: var(--bg-color); cursor: default; }
        .cell.flagged { color: #ff7b72; }
        .cell.mine-hit { background: #b3242b; }
        .cell.wrong-flag { color: var(--text-muted); }

        /* 經典數字配色 (調整成深色底可讀) */
        .n1 { color: #58a6ff; } .n2 { color: #3fb950; } .n3 { color: #ff7b72; }
        .n4 { color: #bc8cff; } .n5 { color: #ffa657; } .n6 { color: #39c5cf; }
        .n7 { color: #f0f6fc; } .n8 { color: #8b949e; }

        /* --- 覆蓋層 --- */
        #overlay {
            position: absolute;
            top: 50%; left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            background: rgba(13, 17, 23, 0.95);
            padding: 22px 30px;
            border-radius: 10px;
            border: 1px solid var(--accent);
            display: none;
            z-index: 10;
            white-space: nowrap;
        }
        #overlay h2 { margin-bottom: 8px; color: var(--accent); font-size: 1.5rem; }
        #overlay p { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 14px; }
        .btn {
            background: var(--accent); color: #0d1117;
            border: none; padding: 8px 22px; border-radius: 5px;
            font-weight: bold; font-size: 1rem; font-family: inherit; cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }

        .hint { font-size: 0.78rem; color: var(--text-muted); text-align: center; }
        #flag-mode { display: none; }

        @media (max-width: 768px) {
            .hint { display: none; }
            /* 手機沒有右鍵，改用旗標模式切換鈕 */
            #flag-mode {
                display: block;
                background: rgba(255,255,255,0.08);
                border: 1px solid var(--border);
                color: var(--text-main);
                padding: 10px 22px;
                border-radius: 8px;
                font-size: 0.95rem;
                font-family: inherit;
                cursor: pointer;
            }
            #flag-mode.active { background: var(--accent); border-color: var(--accent); color: #0d1117; font-weight: bold; }
        }
    </style>

    <!-- 訪客統計 (GoatCounter，不使用 cookie) -->
    <script data-goatcounter="https://rowantsai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

    <div class="game-shell">
        <div class="difficulty">
            <button class="diff-btn active" data-diff="beginner">初級</button>
            <button class="diff-btn" data-diff="intermediate">中級</button>
            <button class="diff-btn" data-diff="expert">高級</button>
        </div>

        <div class="status-bar">
            <div class="counter"><i class="fa-solid fa-flag"></i><span id="mine-count">010</span></div>
            <button id="reset-btn" class="reset-btn" title="重新開始">🙂</button>
            <div class="counter right"><i class="fa-regular fa-clock"></i><span id="timer">000</span></div>
        </div>

        <div id="board-wrap">
            <div id="board"></div>
            <div id="overlay">
                <h2 id="overlay-title">Cleared!</h2>
                <p id="overlay-msg"></p>
                <button class="btn" id="overlay-btn">再玩一次</button>
            </div>
        </div>

        <div class="hint">左鍵翻開 · 右鍵插旗 · 數字上按左鍵快速展開</div>
        <button id="flag-mode">🚩 旗標模式</button>
    </div>

    <script>
        const LEVELS = {
            beginner:     { cols: 9,  rows: 9,  mines: 10, cell: 34, label: '初級' },
            intermediate: { cols: 16, rows: 16, mines: 40, cell: 28, label: '中級' },
            expert:       { cols: 30, rows: 16, mines: 99, cell: 24, label: '高級' }
        };

        const boardEl = document.getElementById('board');
        const mineCountEl = document.getElementById('mine-count');
        const timerEl = document.getElementById('timer');
        const resetBtn = document.getElementById('reset-btn');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const overlayBtn = document.getElementById('overlay-btn');
        const flagModeBtn = document.getElementById('flag-mode');

        let level = 'beginner';
        let cols, rows, mineTotal;
        let cells = [];          // { mine, revealed, flagged, adj, el }
        let started = false;     // 第一次翻開後才佈雷與計時
        let finished = false;
        let revealedCount = 0;
        let flagCount = 0;
        let timerId = null;
        let elapsed = 0;
        let isPaused = false;
        let flagMode = false;

        // --- 建立盤面 ---
        function newGame() {
            const cfg = LEVELS[level];
            cols = cfg.cols; rows = cfg.rows; mineTotal = cfg.mines;

            stopTimer();
            started = false; finished = false; isPaused = false;
            revealedCount = 0; flagCount = 0; elapsed = 0;

            overlay.style.display = 'none';
            boardEl.classList.remove('paused');
            resetBtn.textContent = '🙂';
            updateCounters();

            boardEl.style.setProperty('--cell', cfg.cell + 'px');
            boardEl.style.gridTemplateColumns = `repeat(${cols}, var(--cell))`;
            boardEl.innerHTML = '';

            cells = [];
            const frag = document.createDocumentFragment();
            for (let i = 0; i < cols * rows; i++) {
                const el = document.createElement('div');
                el.className = 'cell';
                el.dataset.i = i;
                frag.appendChild(el);
                cells.push({ mine: false, revealed: false, flagged: false, adj: 0, el });
            }
            boardEl.appendChild(frag);
        }

        // 第一次點擊後才佈雷，並避開點擊格及其周圍 8 格，確保開局一定有安全區
        function placeMines(safeIndex) {
            const safe = new Set(neighbors(safeIndex).concat([safeIndex]));
            const candidates = [];
            for (let i = 0; i < cells.length; i++) {
                if (!safe.has(i)) candidates.push(i);
            }
            // Fisher-Yates 取前 mineTotal 個
            for (let i = candidates.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [candidates[i], candidates[j]] = [candidates[j], candidates[i]];
            }
            candidates.slice(0, mineTotal).forEach(i => { cells[i].mine = true; });

            for (let i = 0; i < cells.length; i++) {
                cells[i].adj = neighbors(i).filter(n => cells[n].mine).length;
            }
        }

        function neighbors(i) {
            const r = Math.floor(i / cols), c = i % cols;
            const out = [];
            for (let dr = -1; dr <= 1; dr++) {
                for (let dc = -1; dc <= 1; dc++) {
                    if (dr === 0 && dc === 0) continue;
                    const nr = r + dr, nc = c + dc;
                    if (nr >= 0 && nr < rows && nc >= 0 && nc < cols) out.push(nr * cols + nc);
                }
            }
            return out;
        }

        // --- 翻開 ---
        function reveal(i) {
            const cell = cells[i];
            if (cell.revealed || cell.flagged) return;

            if (!started) {
                placeMines(i);
                started = true;
                startTimer();
            }

            if (cell.mine) {
                cell.revealed = true;
                cell.el.classList.add('revealed', 'mine-hit');
                cell.el.textContent = '💣';
                endGame(false);
                return;
            }

            // 用堆疊做洪水填充，避免大盤面遞迴過深
            const stack = [i];
            while (stack.length) {
                const idx = stack.pop();
                const c = cells[idx];
                if (c.revealed || c.flagged) continue;
                c.revealed = true;
                revealedCount++;
                paintRevealed(c);
                if (c.adj === 0) neighbors(idx).forEach(n => { if (!cells[n].revealed) stack.push(n); });
            }

            if (revealedCount === cells.length - mineTotal) endGame(true);
        }

        function paintRevealed(c) {
            c.el.classList.add('revealed');
            if (c.adj > 0) {
                c.el.textContent = c.adj;
                c.el.classList.add('n' + c.adj);
            }
        }

        function toggleFlag(i) {
            const cell = cells[i];
            if (cell.revealed) return;
            cell.flagged = !cell.flagged;
            flagCount += cell.flagged ? 1 : -1;
            cell.el.classList.toggle('flagged', cell.flagged);
            cell.el.textContent = cell.flagged ? '🚩' : '';
            updateCounters();
        }

        // 數字格上按左鍵：周圍旗數等於數字時，一次翻開其餘鄰格
        function chord(i) {
            const cell = cells[i];
            if (!cell.revealed || cell.adj === 0) return;
            const ns = neighbors(i);
            const flagged = ns.filter(n => cells[n].flagged).length;
            if (flagged !== cell.adj) return;
            ns.forEach(n => { if (!cells[n].flagged && !cells[n].revealed) reveal(n); });
        }

        // --- 結束 ---
        function endGame(won) {
            finished = true;
            stopTimer();
            resetBtn.textContent = won ? '😎' : '😵';

            if (won) {
                // 剩下沒插旗的地雷自動補旗
                cells.forEach(c => {
                    if (c.mine && !c.flagged) {
                        c.flagged = true;
                        c.el.classList.add('flagged');
                        c.el.textContent = '🚩';
                    }
                });
                flagCount = mineTotal;
                updateCounters();

                const key = 'minesweeperBest_' + level;
                const best = Number(localStorage.getItem(key)) || 0;
                let msg = `${LEVELS[level].label} · 用時 ${elapsed} 秒`;
                if (!best || elapsed < best) {
                    localStorage.setItem(key, elapsed);
                    msg += '（新紀錄！）';
                } else {
                    msg += ` · 最佳 ${best} 秒`;
                }
                showOverlay('Cleared! 🎉', msg, '再玩一次');
            } else {
                // 攤開所有地雷，插錯的旗打叉
                cells.forEach(c => {
                    if (c.mine && !c.flagged && !c.el.classList.contains('mine-hit')) {
                        c.el.classList.add('revealed');
                        c.el.textContent = '💣';
                    } else if (!c.mine && c.flagged) {
                        c.el.classList.add('revealed', 'wrong-flag');
                        c.el.textContent = '✗';
                    }
                });
                showOverlay('Game Over', `${LEVELS[level].label} · 踩到地雷了`, '再玩一次');
            }
        }

        function showOverlay(title, msg, btnText) {
            overlayTitle.textContent = title;
            overlayMsg.textContent = msg;
            overlayBtn.textContent = btnText;
            overlay.style.display = 'block';
        }

        // --- 計時與計數 ---
        function startTimer() {
            stopTimer();
            timerId = setInterval(() => {
                elapsed++;
                if (elapsed > 999) elapsed = 999;
                updateCounters();
            }, 1000);
        }
        function stopTimer() {
            if (timerId) clearInterval(timerId);
            timerId = null;
        }
        function pad(n) { return String(Math.max(0, n)).padStart(3, '0'); }
        function updateCounters() {
            mineCountEl.textContent = pad(mineTotal - flagCount);
            timerEl.textContent = pad(elapsed);
        }

        // --- 輸入處理 ---
        let pressTimer = null;
        let longPressed = false;

        function cellIndexFrom(e) {
            const el = e.target.closest('.cell');
            return el ? Number(el.dataset.i) : -1;
        }

        boardEl.addEventListener('click', (e) => {
            if (finished || isPaused || longPressed) return;
            const i = cellIndexFrom(e);
            if (i < 0) return;
            if (flagMode) { toggleFlag(i); return; }
            if (cells[i].revealed) chord(i);
            else reveal(i);
        });

        boardEl.addEventListener('contextmenu', (e) => {
            e.preventDefault();
            if (finished || isPaused) return;
            const i = cellIndexFrom(e);
            if (i >= 0) toggleFlag(i);
        });

        // 中鍵也可以快速展開
        boardEl.addEventListener('auxclick', (e) => {
            if (e.button !== 1 || finished || isPaused) return;
            e.preventDefault();
            const i = cellIndexFrom(e);
            if (i >= 0) chord(i);
        });

        // 手機長按插旗
        boardEl.addEventListener('pointerdown', (e) => {
            if (e.pointerType === 'mouse' || finished || isPaused) return;
            const i = cellIndexFrom(e);
            if (i < 0) return;
            longPressed = false;
            pressTimer = setTimeout(() => {
                longPressed = true;
                toggleFlag(i);
            }, 400);
        });
        ['pointerup', 'pointercancel', 'pointerleave', 'pointermove'].forEach(type => {
            boardEl.addEventListener(type, () => {
                if (pressTimer) { clearTimeout(pressTimer); pressTimer = null; }
            });
        });
        // click 在 pointerup 之後才觸發，長按後要吃掉那一次 click
        boardEl.addEventListener('click', () => {
            if (longPressed) setTimeout(() => { longPressed = false; }, 0);
        }, true);

        document.querySelectorAll('.diff-btn').forEach(btn => {
            btn.addEventListener('click', () => {
                document.querySelector('.diff-btn.active').classList.remove('active');
                btn.classList.add('active');
                level = btn.dataset.diff;
                newGame();
            });
        });

        resetBtn.addEventListener('click', () => newGame());
        // 覆蓋層按鈕在「暫停」和「結束」兩種狀態下功能不同，用同一個處理器分流，
        // 避免兩個監聽器同時觸發 (暫停後按繼續會連帶重開一局)
        overlayBtn.addEventListener('click', () => {
            if (isPaused) resume();
            else newGame();
        });

        flagModeBtn.addEventListener('click', () => {
            flagMode = !flagMode;
            flagModeBtn.classList.toggle('active', flagMode);
        });

        // 切換分頁時暫停計時並遮住盤面 (避免偷閒被打斷時紀錄被拖累)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden) {
                if (!started || finished || isPaused) return;
                isPaused = true;
                stopTimer();
                boardEl.classList.add('paused');
                showOverlay('Paused', '離開分頁時自動暫停', '繼續遊戲');
            }
        });

        function resume() {
            isPaused = false;
            boardEl.classList.remove('paused');
            overlay.style.display = 'none';
            startTimer();
        }

        newGame();
    </script>
</body>
</html>
