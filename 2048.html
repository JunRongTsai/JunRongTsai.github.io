<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO 優化 -->
    <meta name="description" content="用瀏覽器就能玩的 2048 數字合併遊戲，支援鍵盤方向鍵與手機滑動操作，並記錄最高分。">
    <meta property="og:title" content="2048 | Arcade">
    <meta property="og:description" content="Rowan Tsai 休憩區內建的網頁版 2048 小遊戲。">
    <meta property="og:image" content="images/profile.jpg">
    <link rel="canonical" href="https://junrongtsai.github.io/2048.html">

    <title>2048 | Arcade</title>

    <meta name="theme-color" content="#0d1117">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='34' fill='%2358a6ff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入獨立的 CSS (共用主站變數系統) -->
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; user-select: none; }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        :root { --tile: 104px; --gap: 12px; }

        .game-shell { display: flex; flex-direction: column; gap: 14px; }

        /* --- 記分列 --- */
        .top-bar { display: flex; align-items: flex-end; justify-content: space-between; gap: 14px; }
        .brand { font-size: 2.4rem; font-weight: 800; color: var(--accent); line-height: 1; letter-spacing: -1px; }
        .scores { display: flex; gap: 10px; }
        .score-box {
            background: var(--bg-color);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 6px 16px;
            text-align: center;
            min-width: 84px;
        }
        .score-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .score-value { font-size: 1.25rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        #best { color: gold; }

        .bar-actions { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
        .hint { font-size: 0.8rem; color: var(--text-muted); }
        .btn {
            background: var(--accent); color: #0d1117;
            border: none; padding: 8px 20px; border-radius: 6px;
            font-weight: bold; font-size: 0.95rem; font-family: inherit; cursor: pointer;
        }
        .btn:hover { opacity: 0.9; }

        /* --- 盤面 --- */
        #board {
            position: relative;
            width: calc(var(--tile) * 4 + var(--gap) * 5);
            height: calc(var(--tile) * 4 + var(--gap) * 5);
            background: var(--bg-color);
            border: 2px solid var(--border);
            border-radius: 10px;
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.15);
            touch-action: none;
        }
        .grid-cell {
            position: absolute;
            width: var(--tile); height: var(--tile);
            background: rgba(255,255,255,0.04);
            border-radius: 6px;
        }

        .tile {
            position: absolute;
            width: var(--tile); height: var(--tile);
            border-radius: 6px;
            display: flex; align-items: center; justify-content: center;
            font-size: calc(var(--tile) * 0.42);
            font-weight: 800;
            color: #f0f6fc;
            background: #1f2b3a;
            transition: transform 0.12s ease-in-out;
            will-change: transform;
        }
        .tile.small { font-size: calc(var(--tile) * 0.32); }
        .tile.tiny  { font-size: calc(var(--tile) * 0.25); }

        .tile.spawn { animation: spawn 0.14s ease-out; }
        .tile.merged { animation: pop 0.16s ease-out; }
        @keyframes spawn { from { transform: var(--pos) scale(0); } to { transform: var(--pos) scale(1); } }
        @keyframes pop { 0% { transform: var(--pos) scale(1); } 50% { transform: var(--pos) scale(1.18); } 100% { transform: var(--pos) scale(1); } }

        /* 數值配色：低分冷色，越大越亮，2048 以上轉金色 */
        .v2    { background: #22303f; color: #9fb4c9; }
        .v4    { background: #294357; color: #b9d3ea; }
        .v8    { background: #2f5a85; }
        .v16   { background: #366fa8; }
        .v32   { background: #3d86cc; }
        .v64   { background: #4796e8; }
        .v128  { background: #58a6ff; color: #06121f; }
        .v256  { background: #7cc0ff; color: #06121f; }
        .v512  { background: #a5d5ff; color: #06121f; }
        .v1024 { background: #ffd166; color: #3d2c00; }
        .v2048 { background: #ffb000; color: #3d2c00; box-shadow: 0 0 24px rgba(255, 176, 0, 0.65); }
        .vsuper{ background: #ff8a00; color: #2b1800; box-shadow: 0 0 26px rgba(255, 138, 0, 0.7); }

        /* --- 覆蓋層 --- */
        #overlay {
            position: absolute;
            inset: 0;
            background: rgba(13, 17, 23, 0.9);
            backdrop-filter: blur(4px);
            border-radius: 10px;
            display: none;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            gap: 10px;
            z-index: 20;
        }
        #overlay.show { display: flex; }
        #overlay h2 { font-size: 2rem; color: var(--accent); }
        #overlay p { color: var(--text-muted); font-size: 0.9rem; }

        @media (max-width: 768px) {
            :root { --tile: min(19vw, 84px); --gap: 10px; }
            .brand { font-size: 1.9rem; }
            .hint { display: none; }
        }
    </style>

    <!-- 訪客統計 (GoatCounter，不使用 cookie) -->
    <script data-goatcounter="https://rowantsai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

    <div class="game-shell">
        <div class="top-bar">
            <div class="brand">2048</div>
            <div class="scores">
                <div class="score-box">
                    <div class="score-label">Score</div>
                    <div class="score-value" id="score">0</div>
                </div>
                <div class="score-box">
                    <div class="score-label">Best</div>
                    <div class="score-value" id="best">0</div>
                </div>
            </div>
        </div>

        <div class="bar-actions">
            <div class="hint">方向鍵或 WASD 移動</div>
            <button class="btn" id="new-game">新遊戲</button>
        </div>

        <div id="board">
            <div id="overlay">
                <h2 id="overlay-title">Game Over</h2>
                <p id="overlay-msg"></p>
                <button class="btn" id="overlay-btn">再玩一次</button>
            </div>
        </div>
    </div>

    <script>
        const SIZE = 4;
        const boardEl = document.getElementById('board');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');
        const overlay = document.getElementById('overlay');
        const overlayTitle = document.getElementById('overlay-title');
        const overlayMsg = document.getElementById('overlay-msg');
        const overlayBtn = document.getElementById('overlay-btn');

        let grid = [];       // SIZE x SIZE，存 tile 物件或 null
        let tiles = new Map(); // id -> { id, value, r, c, el }
        let nextId = 1;
        let score = 0;
        let best = Number(localStorage.getItem('2048Best')) || 0;
        let won = false;     // 已經達成 2048 並選擇繼續
        let finished = false;

        bestEl.textContent = best;

        // 背景格子只建立一次
        for (let r = 0; r < SIZE; r++) {
            for (let c = 0; c < SIZE; c++) {
                const cell = document.createElement('div');
                cell.className = 'grid-cell';
                cell.style.transform = posTransform(r, c);
                boardEl.appendChild(cell);
            }
        }

        function posTransform(r, c) {
            // 用 calc 讓位置跟著 --tile / --gap 變化，手機縮放時不用重算
            return `translate(calc(var(--gap) + (var(--tile) + var(--gap)) * ${c}), ` +
                   `calc(var(--gap) + (var(--tile) + var(--gap)) * ${r}))`;
        }

        function valueClass(v) {
            if (v > 2048) return 'vsuper';
            return 'v' + v;
        }
        function sizeClass(v) {
            if (v >= 1024) return 'tiny';
            if (v >= 128) return 'small';
            return '';
        }

        function addTile(r, c, value, spawn = true) {
            const el = document.createElement('div');
            const tile = { id: nextId++, value, r, c, el };
            el.className = `tile ${valueClass(value)} ${sizeClass(value)}`.trim();
            el.textContent = value;
            const pos = posTransform(r, c);
            el.style.setProperty('--pos', pos);
            el.style.transform = pos;
            if (spawn) el.classList.add('spawn');
            boardEl.appendChild(el);
            grid[r][c] = tile;
            tiles.set(tile.id, tile);
            return tile;
        }

        function moveTileTo(tile, r, c) {
            tile.r = r; tile.c = c;
            const pos = posTransform(r, c);
            tile.el.style.setProperty('--pos', pos);
            tile.el.style.transform = pos;
        }

        function removeTile(tile) {
            tiles.delete(tile.id);
            // 等滑動動畫跑完再移除，才看得到被合併的方塊滑過去
            const el = tile.el;
            setTimeout(() => el.remove(), 130);
        }

        function updateTileValue(tile, value) {
            tile.value = value;
            tile.el.textContent = value;
            tile.el.className = `tile ${valueClass(value)} ${sizeClass(value)}`.trim();
            // 重新觸發 pop 動畫
            void tile.el.offsetWidth;
            tile.el.classList.add('merged');
        }

        function emptyCells() {
            const out = [];
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) if (!grid[r][c]) out.push({ r, c });
            }
            return out;
        }

        function spawnRandom() {
            const cells = emptyCells();
            if (!cells.length) return;
            const { r, c } = cells[Math.floor(Math.random() * cells.length)];
            addTile(r, c, Math.random() < 0.9 ? 2 : 4);
        }

        function newGame() {
            tiles.forEach(t => t.el.remove());
            tiles.clear();
            grid = Array.from({ length: SIZE }, () => Array(SIZE).fill(null));
            score = 0; won = false; finished = false;
            scoreEl.textContent = '0';
            overlay.classList.remove('show');
            spawnRandom();
            spawnRandom();
        }

        // dir: 'left' | 'right' | 'up' | 'down'
        function move(dir) {
            if (finished) return;

            const horizontal = dir === 'left' || dir === 'right';
            const forward = dir === 'right' || dir === 'down';
            // 往哪個方向壓縮，就從那一側開始掃
            const order = [0, 1, 2, 3];
            const scan = forward ? [...order].reverse() : order;

            let moved = false;
            let gained = 0;
            const mergedThisMove = new Set();

            for (const line of order) {
                for (const idx of scan) {
                    const r = horizontal ? line : idx;
                    const c = horizontal ? idx : line;
                    const tile = grid[r][c];
                    if (!tile) continue;

                    let nr = r, nc = c;
                    const dr = dir === 'up' ? -1 : dir === 'down' ? 1 : 0;
                    const dc = dir === 'left' ? -1 : dir === 'right' ? 1 : 0;

                    // 一路滑到底
                    while (true) {
                        const tr = nr + dr, tc = nc + dc;
                        if (tr < 0 || tr >= SIZE || tc < 0 || tc >= SIZE) break;
                        const target = grid[tr][tc];
                        if (!target) { nr = tr; nc = tc; continue; }
                        // 撞到同值且該格這回合還沒合併過 -> 合併
                        if (target.value === tile.value && !mergedThisMove.has(target.id)) {
                            grid[r][c] = null;
                            moveTileTo(tile, tr, tc);
                            removeTile(tile);
                            const newValue = target.value * 2;
                            updateTileValue(target, newValue);
                            mergedThisMove.add(target.id);
                            gained += newValue;
                            if (newValue === 2048 && !won) {
                                won = true;
                                setTimeout(() => showOverlay('You Win! 🎉', `達成 2048！目前分數 ${score}`, '繼續挑戰'), 160);
                            }
                            moved = true;
                        }
                        break;
                    }

                    if (grid[r][c] === tile && (nr !== r || nc !== c)) {
                        grid[r][c] = null;
                        grid[nr][nc] = tile;
                        moveTileTo(tile, nr, nc);
                        moved = true;
                    }
                }
            }

            if (!moved) return;

            score += gained;
            scoreEl.textContent = score;
            if (score > best) {
                best = score;
                bestEl.textContent = best;
                localStorage.setItem('2048Best', best);
            }

            spawnRandom();
            if (!hasMoves()) {
                finished = true;
                showOverlay('Game Over', `沒有可移動的步數了 · 得分 ${score}`, '再玩一次');
            }
        }

        function hasMoves() {
            if (emptyCells().length) return true;
            for (let r = 0; r < SIZE; r++) {
                for (let c = 0; c < SIZE; c++) {
                    const v = grid[r][c].value;
                    if (c + 1 < SIZE && grid[r][c + 1].value === v) return true;
                    if (r + 1 < SIZE && grid[r + 1][c].value === v) return true;
                }
            }
            return false;
        }

        function showOverlay(title, msg, btnText) {
            overlayTitle.textContent = title;
            overlayMsg.textContent = msg;
            overlayBtn.textContent = btnText;
            overlay.classList.add('show');
        }

        // --- 輸入 ---
        const KEY_DIRS = {
            ArrowLeft: 'left', ArrowRight: 'right', ArrowUp: 'up', ArrowDown: 'down',
            a: 'left', d: 'right', w: 'up', s: 'down',
            A: 'left', D: 'right', W: 'up', S: 'down'
        };

        document.addEventListener('keydown', (e) => {
            const dir = KEY_DIRS[e.key];
            if (!dir) return;
            e.preventDefault();
            if (overlay.classList.contains('show')) return;
            move(dir);
        });

        // 手機滑動
        let touchStart = null;
        boardEl.addEventListener('touchstart', (e) => {
            if (e.touches.length !== 1) return;
            touchStart = { x: e.touches[0].clientX, y: e.touches[0].clientY };
        }, { passive: true });

        boardEl.addEventListener('touchend', (e) => {
            if (!touchStart || overlay.classList.contains('show')) { touchStart = null; return; }
            const t = e.changedTouches[0];
            const dx = t.clientX - touchStart.x;
            const dy = t.clientY - touchStart.y;
            touchStart = null;
            if (Math.max(Math.abs(dx), Math.abs(dy)) < 30) return; // 太短的滑動忽略
            move(Math.abs(dx) > Math.abs(dy) ? (dx > 0 ? 'right' : 'left') : (dy > 0 ? 'down' : 'up'));
        });

        document.getElementById('new-game').addEventListener('click', newGame);
        overlayBtn.addEventListener('click', () => {
            // 達成 2048 的提示只是恭喜，關掉繼續玩；真的沒步數才重開
            if (finished) newGame();
            else overlay.classList.remove('show');
        });

        newGame();
    </script>
</body>
</html>
