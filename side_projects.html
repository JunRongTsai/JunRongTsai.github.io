<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <!-- SEO 優化 -->
    <meta name="description" content="蔡俊榮 (Rowan Tsai) 的休憩區，收錄自製小工具與貪食蛇、俄羅斯方塊等網頁小遊戲。">
    <meta property="og:title" content="休憩區 (Playground) | Rowan Tsai">
    <meta property="og:description" content="工程師的摸魚專區：自製小工具與經典網頁小遊戲合集。">
    <meta property="og:image" content="images/profile.jpg">
    <link rel="canonical" href="https://junrongtsai.github.io/side_projects.html">

    <title>休憩區 (Playground) | Rowan Tsai</title>

    <meta name="theme-color" content="#0d1117">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='34' fill='%2358a6ff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">

    <!-- 引入 FontAwesome -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入獨立的 CSS (沿用 Index 的變數系統，保持風格一致) -->
    <link rel="stylesheet" href="style.css">
    <style>
        .back-link { color: var(--text-muted); font-size: 0.95rem; }
        .back-link:hover { color: var(--accent); }

        /* 主容器 */
        .container {
            max-width: 1000px;
            margin: 0 auto;
            padding: 7rem 2rem 4rem 2rem;
            min-height: 100vh;
        }

        h1 { font-size: 2.5rem; margin-bottom: 1rem; color: var(--text-main); text-align: center; }
        .subtitle { color: var(--text-muted); text-align: center; margin-bottom: 3rem; }

        h2 {
            font-size: 1.8rem; margin: 3rem 0 1.5rem 0;
            border-left: 4px solid var(--accent);
            padding-left: 15px;
            color: var(--text-main);
        }

        /* --- 1. 小工具網格 --- */
        .tools-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 20px;
        }
        .tool-card {
            background: var(--card-bg);
            padding: 1.5rem;
            border-radius: 8px;
            border: 1px solid var(--border);
            transition: transform 0.2s, border-color 0.2s;
        }
        .tool-card:hover { transform: translateY(-5px); border-color: var(--accent); }
        .tool-icon { font-size: 2rem; color: var(--accent); margin-bottom: 1rem; }
        .tool-title { font-size: 1.2rem; font-weight: bold; margin-bottom: 0.5rem; }
        .tool-desc { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
        .tool-link { 
            display: inline-block; font-size: 0.85rem; color: var(--accent); 
            border: 1px solid var(--accent); padding: 4px 12px; border-radius: 4px;
        }
        .tool-link:hover { background: var(--accent-glow); }
        .tool-link.disabled-link {
            color: var(--text-muted); border-color: var(--border);
            opacity: 0.6; cursor: not-allowed;
        }
        .tool-link.disabled-link:hover { background: none; }

        /* --- 2. 遊戲網格 (Arcade) --- */
        .game-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
        }
        .game-card {
            background: #161b22;
            border: 1px solid var(--border);
            border-radius: 12px;
            overflow: hidden;
            cursor: pointer;
            transition: all 0.3s;
            text-align: center;
            padding-bottom: 15px;
        }
        .game-card:hover {
            border-color: var(--accent);
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(88, 166, 255, 0.2);
        }
        .game-thumbnail {
            width: 100%;
            height: 120px;
            background: #21262d; /* 之後可以換成遊戲截圖 */
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 3rem;
            color: var(--text-muted);
            transition: 0.3s;
        }
        .game-card:hover .game-thumbnail { color: var(--accent); }
        .game-title {
            margin-top: 15px;
            font-weight: bold;
            color: var(--text-main);
        }

        /* --- 3. 遊戲播放器 (Game Viewer) --- */
        /* 這就是所謂的 Sub-frame 區域，平常隱藏 */
        #game-viewer {
            display: none; 
            margin-top: 40px;
            background: #0d1117;
            border: 1px solid var(--accent);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(0,0,0,0.5);
            overflow: hidden;
            animation: fadeIn 0.5s;
        }
        
        .viewer-header {
            background: #161b22;
            padding: 10px 20px;
            display: flex; justify-content: space-between; align-items: center;
            border-bottom: 1px solid var(--border);
        }
        .viewer-title { color: var(--accent); font-weight: bold; font-family: monospace; }
        .close-btn { 
            color: #e5534b; cursor: pointer; font-size: 1.1rem; transition: 0.2s;
        }
        .close-btn:hover { color: #ff7b72; transform: scale(1.1); }

        /* Iframe: 載入獨立 HTML 的視窗 */
        #game-frame {
            width: 100%;
            height: 600px; /* 足夠的高度 */
            border: none;
            background: #000;
            display: block;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Footer */
        footer {
            text-align: center; margin-top: 4rem; color: var(--text-muted); font-size: 0.8rem;
            border-top: 1px solid var(--border); padding-top: 2rem;
        }
    </style>
</head>
<body>

    <nav>
        <div class="nav-logo">Rowan<span>.Dev</span></div>
        <a href="index.html" class="back-link"><i class="fa-solid fa-arrow-left"></i> 回首頁</a>
    </nav>

    <main class="container">
        <h1>休憩區 & 實驗室</h1>
        <p class="subtitle">這裡存放著我的 Side Projects 以及... 適合上班偷閒的小遊戲</p>

        <!-- 1. 實用工具區 -->
        <h2><i class="fa-solid fa-toolbox"></i> 實用小工具</h2>
        <div class="tools-grid">
            
            <div class="tool-card">
                <div class="tool-icon"><i class="fa-solid fa-file-code"></i></div>
                <div class="tool-title">Log Parser</div>
                <div class="tool-desc">快速分析 Server Log 並產出 Excel 報表的小工具。</div>
                <span class="tool-link disabled-link" title="即將推出"><i class="fa-solid fa-lock"></i> 敬請期待</span>
            </div>

            <div class="tool-card">
                <div class="tool-icon"><i class="fa-solid fa-robot"></i></div>
                <div class="tool-title">Auto Clicker</div>
                <div class="tool-desc">簡單的滑鼠連點程式，適用於重複性作業。</div>
                <span class="tool-link disabled-link" title="即將推出"><i class="fa-solid fa-lock"></i> 敬請期待</span>
            </div>

            <div class="tool-card">
                <div class="tool-icon"><i class="fa-solid fa-network-wired"></i></div>
                <div class="tool-title">IP Scanner</div>
                <div class="tool-desc">區域網路設備掃描工具，快速找出佔用 IP。</div>
                <span class="tool-link disabled-link" title="即將推出"><i class="fa-solid fa-lock"></i> 敬請期待</span>
            </div>

        </div>

        <!-- 2. 摸魚遊戲區 -->
        <h2><i class="fa-solid fa-ghost"></i> 摸魚專區 (Arcade)</h2>
        
        <div class="game-grid">
            <!-- 貪食蛇卡片 -->
            <div class="game-card" onclick="playGame('snake.html', '經典貪食蛇 (Snake)')">
                <div class="game-thumbnail">
                    <i class="fa-solid fa-staff-snake"></i>
                </div>
                <div class="game-title">經典貪食蛇</div>
            </div>

            <!-- 俄羅斯方塊卡片 -->
            <div class="game-card" onclick="playGame('tetris.html', '俄羅斯方塊 (Tetris)')">
                <div class="game-thumbnail">
                    <i class="fa-solid fa-cubes"></i>
                </div>
                <div class="game-title">俄羅斯方塊</div>
            </div>
            
            <!-- 更多遊戲 -->
            <div class="game-card" onclick="alert('開發中...')">
                <div class="game-thumbnail">
                    <i class="fa-solid fa-gamepad"></i>
                </div>
                <div class="game-title">更多遊戲...</div>
            </div>
        </div>

        <!-- 遊戲播放器 (Iframe) -->
        <div id="game-viewer">
            <div class="viewer-header">
                <span class="viewer-title" id="viewer-title">遊戲標題</span>
                <span class="close-btn" onclick="closeGame()"><i class="fa-solid fa-xmark"></i> 關閉遊戲</span>
            </div>
            <!-- Sub-frame: 這裡會動態載入遊戲檔案 -->
            <iframe id="game-frame" src=""></iframe>
        </div>

    </main>

    <footer>
        <p>Designed for relaxing. &copy; 2025 Rowan Tsai</p>
    </footer>

    <script>
        function playGame(url, title) {
            // 1. 設定標題
            document.getElementById('viewer-title').innerText = title;
            
            // 2. 顯示播放器區塊
            const viewer = document.getElementById('game-viewer');
            viewer.style.display = 'block';
            
            // 3. 設定 Iframe 內容
            const frame = document.getElementById('game-frame');
            // 各遊戲畫面實際所需高度不同（例如俄羅斯方塊 320x640 畫布較高），依遊戲調整 iframe 高度避免上下被裁切
            const frameHeights = { 'tetris.html': 700 };
            frame.style.height = (frameHeights[url] || 600) + 'px';
            frame.src = url;

            // 4. 自動捲動到遊戲區
            viewer.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }

        function closeGame() {
            // 關閉時清空 src，停止遊戲運作（避免背景音效或運算繼續）
            const viewer = document.getElementById('game-viewer');
            const frame = document.getElementById('game-frame');
            
            viewer.style.display = 'none';
            frame.src = '';
            frame.removeAttribute('srcdoc');
        }
    </script>
</body>
</html>
