<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO 優化 -->
    <meta name="description" content="用瀏覽器就能玩的經典貪食蛇小遊戲，支援桌機鍵盤與手機虛擬搖桿操作。">
    <meta property="og:title" content="經典貪食蛇 | Arcade">
    <meta property="og:description" content="Rowan Tsai 休憩區內建的網頁版貪食蛇小遊戲。">
    <meta property="og:image" content="images/profile.jpg">
    <link rel="canonical" href="https://junrongtsai.github.io/snake.html">

    <title>經典貪食蛇 | Arcade</title>

    <meta name="theme-color" content="#0d1117">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='34' fill='%2358a6ff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">

    <!-- 引入 FontAwesome 圖標 -->
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入獨立的 CSS (共用主站變數系統) -->
    <link rel="stylesheet" href="style.css">
    <style>
        /* --- 遊戲專屬變數 --- */
        :root {
            --food: #ff7b72;
            --snake-head: #58a6ff;
            --snake-body: #8b949e;
        }

        * { margin: 0; padding: 0; user-select: none; }

        body {
            background-color: #000; /* 遊戲區用全黑背景比較有沉浸感 */
            color: var(--text-main);
            font-family: 'Segoe UI', monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden; /* 防止遊戲時畫面滑動 */
        }

        /* --- 遊戲資訊看板 --- */
        .game-header {
            width: 100%;
            max-width: 400px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
            padding: 0 10px;
        }

        .score-box {
            font-size: 1.2rem;
            font-weight: bold;
        }
        .score-box span { color: var(--accent); }

        .level-box {
            font-size: 1rem;
            font-weight: bold;
            color: var(--accent);
        }

        .high-score {
            font-size: 0.9rem;
            color: #8b949e;
        }

        /* --- 畫布設定 --- */
        canvas {
            background-color: var(--bg-color);
            border: 2px solid var(--border);
            border-radius: 4px;
            box-shadow: 0 0 20px rgba(88, 166, 255, 0.1);
            display: block;
        }

        /* --- 虛擬按鍵 (手機版顯示) --- */
        .mobile-controls {
            display: none;
            margin-top: 20px;
            grid-template-areas:
                ". up ."
                "left down right";
            gap: 10px;
        }
        
        .control-btn {
            width: 60px; height: 60px;
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--border);
            border-radius: 50%;
            color: var(--text-main);
            font-size: 1.5rem;
            display: flex; align-items: center; justify-content: center;
            cursor: pointer;
        }
        .control-btn:active { background: var(--accent); color: #000; }

        /* 只有在觸控裝置或螢幕太窄時顯示 */
        @media (max-width: 768px) {
            .mobile-controls { display: grid; }
            canvas { max-width: 95vw; }
        }
    </style>

    <!-- 訪客統計 (GoatCounter，不使用 cookie) -->
    <script data-goatcounter="https://rowantsai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

    <div class="game-header">
        <div class="score-box">Score: <span id="score">0</span></div>
        <div class="level-box">Lv <span id="level">1</span></div>
        <div class="high-score">High: <span id="highScore">0</span></div>
    </div>

    <!-- 遊戲畫布 -->
    <canvas id="gameCanvas" width="400" height="400"></canvas>

    <!-- 共用覆蓋層 (開始 / 結束 / 暫停) -->
    <div class="game-overlay" id="game-overlay">
        <div class="overlay-title" id="overlay-title">SNAKE</div>
        <div class="overlay-sub" id="overlay-sub"></div>
        <div class="overlay-stats" id="overlay-stats"></div>
        <button class="overlay-btn" id="overlay-btn">開始遊戲</button>
        <div class="overlay-controls hidden" id="overlay-controls">
            <div><span class="key">←</span><span class="key">↑</span><span class="key">→</span><span class="key">↓</span> 控制方向</div>
            <div><span class="key">Space</span> 暫停 / 繼續</div>
            <div>吃到食物會變長，每 5 分加快一級</div>
        </div>
    </div>

    <!-- 手機虛擬搖桿 -->
    <div class="mobile-controls">
        <div class="control-btn" style="grid-area: up;" ontouchstart="changeDirection('UP', event)"><i class="fa-solid fa-arrow-up"></i></div>
        <div class="control-btn" style="grid-area: left;" ontouchstart="changeDirection('LEFT', event)"><i class="fa-solid fa-arrow-left"></i></div>
        <div class="control-btn" style="grid-area: down;" ontouchstart="changeDirection('DOWN', event)"><i class="fa-solid fa-arrow-down"></i></div>
        <div class="control-btn" style="grid-area: right;" ontouchstart="changeDirection('RIGHT', event)"><i class="fa-solid fa-arrow-right"></i></div>
    </div>

    <script src="game-ui.js"></script>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const levelEl = document.getElementById('level');
        const highScoreEl = document.getElementById('highScore');

        // --- 遊戲參數 ---
        const box = 20; // 格子大小
        let snake = [];
        let food = {};
        let score = 0;
        let level = 1;
        let d; // 下一步要走的方向 (可能還沒生效)
        let appliedDir; // 上一個 tick 實際走的方向，用來擋反向自撞
        let game; // Loop
        let isPaused = false;
        let isGameOver = false;
        const BASE_SPEED = 100; // 毫秒 (越小越快)
        let gameSpeed = BASE_SPEED;

        // --- 讀取最高分 (localStorage) ---
        let highScore = localStorage.getItem('snakeHighScore') || 0;
        highScoreEl.innerText = highScore;

        // --- 初始化 ---
        function init() {
            snake = [];
            snake[0] = { x: 9 * box, y: 10 * box }; // 初始位置
            score = 0;
            level = 1;
            gameSpeed = BASE_SPEED;
            d = null; // 初始靜止
            appliedDir = null;
            isGameOver = false;
            isPaused = false;
            scoreEl.innerText = score;
            levelEl.innerText = level;
            createFood();

            // 清空畫布
            ctx.fillStyle = "#0d1117";
            ctx.fillRect(0, 0, canvas.width, canvas.height);
            drawSnake(); // 畫出初始蛇
            drawFood();  // 畫出初始食物
        }

        function showStartScreen() {
            GameUI.show({
                title: 'SNAKE',
                sub: '經典貪食蛇',
                stats: Number(highScore) ? `最高分 ${highScore}` : '',
                button: '開始遊戲',
                controls: true,
                onButton: startGame
            });
        }

        function createFood() {
            // 隨機產生食物，並確保不會生成在蛇身上
            for (let i = 0; i < 100; i++) {
                const candidate = {
                    x: Math.floor(Math.random() * (canvas.width / box)) * box,
                    y: Math.floor(Math.random() * (canvas.height / box)) * box
                };
                if (!collision(candidate, snake)) {
                    food = candidate;
                    return;
                }
            }

            // 隨機取樣連續失敗代表棋盤幾乎被填滿，改成掃描剩下的空格，
            // 避免蛇長到接近填滿整個棋盤時在這裡無限迴圈把分頁卡死
            const freeCells = [];
            for (let x = 0; x < canvas.width; x += box) {
                for (let y = 0; y < canvas.height; y += box) {
                    if (!collision({ x, y }, snake)) freeCells.push({ x, y });
                }
            }
            if (freeCells.length === 0) {
                winGame(); // 沒有空格 = 蛇填滿棋盤，通關
                return;
            }
            food = freeCells[Math.floor(Math.random() * freeCells.length)];
        }

        // 隨分數提升難度：每 5 分升一級，速度隨等級加快 (下限 50ms)
        function updateSpeed() {
            const newLevel = Math.floor(score / 5) + 1;
            if (newLevel !== level) {
                level = newLevel;
                levelEl.innerText = level;
            }
            const newSpeed = Math.max(50, BASE_SPEED - (level - 1) * 8);
            if (newSpeed !== gameSpeed) {
                gameSpeed = newSpeed;
                clearInterval(game);
                game = setInterval(draw, gameSpeed);
            }
        }

        // --- 鍵盤監聽 ---
        document.addEventListener('keydown', direction);

        function direction(event) {
            let key = event.keyCode;

            // 防止方向鍵/空白鍵捲動網頁
            if([32, 37, 38, 39, 40].indexOf(key) > -1) {
                event.preventDefault();
            }

            // 覆蓋層顯示中 (開始 / 結束 / 暫停畫面)：按鍵交給 GameUI 處理
            if (GameUI.isVisible) return;

            // 空白鍵 (32) -> 暫停/繼續
            if (key == 32) {
                togglePause();
                return;
            }

            // 比對 appliedDir (上一步實際走的方向) 而不是 d，
            // 否則同一個 tick 內連按兩次 (例如 ↑ 再 ←) 會繞過檢查而反向撞到自己
            if (key == 37 && appliedDir != "RIGHT") d = "LEFT";
            else if (key == 38 && appliedDir != "DOWN") d = "UP";
            else if (key == 39 && appliedDir != "LEFT") d = "RIGHT";
            else if (key == 40 && appliedDir != "UP") d = "DOWN";
        }

        // 手機版觸控控制
        function changeDirection(newDir, e) {
            if (e) e.preventDefault();
            if (GameUI.isVisible) return;
            if (newDir == "LEFT" && appliedDir != "RIGHT") d = "LEFT";
            if (newDir == "UP" && appliedDir != "DOWN") d = "UP";
            if (newDir == "RIGHT" && appliedDir != "LEFT") d = "RIGHT";
            if (newDir == "DOWN" && appliedDir != "UP") d = "DOWN";
        }

        // --- 繪圖邏輯 ---
        function draw() {
            if (isPaused) return;

            // 畫背景
            ctx.fillStyle = "#0d1117";
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            drawFood();
            drawSnake();

            // 蛇頭座標
            let snakeX = snake[0].x;
            let snakeY = snake[0].y;

            // 移動邏輯
            if (d == "LEFT") snakeX -= box;
            if (d == "UP") snakeY -= box;
            if (d == "RIGHT") snakeX += box;
            if (d == "DOWN") snakeY += box;

            // 如果沒方向(剛開始)，就不動
            if (!d) return;

            // 記錄這個 tick 真正採用的方向，供下次輸入做反向檢查
            appliedDir = d;

            // 吃到食物
            if (snakeX == food.x && snakeY == food.y) {
                score++;
                scoreEl.innerText = score;
                // 更新最高分顯示
                if (score > highScore) {
                    highScore = score;
                    highScoreEl.innerText = highScore;
                    localStorage.setItem('snakeHighScore', highScore); // 存入瀏覽器
                }
                updateSpeed();
                createFood();
            } else {
                snake.pop(); // 沒吃到，移除尾巴
            }

            // 碰撞檢測 (撞牆 或 撞自己)
            let newHead = { x: snakeX, y: snakeY };

            if (snakeX < 0 || snakeX >= canvas.width || 
                snakeY < 0 || snakeY >= canvas.height || 
                collision(newHead, snake)) {
                
                gameOver();
                return;
            }

            snake.unshift(newHead); // 加入新頭
        }

        function drawSnake() {
            for (let i = 0; i < snake.length; i++) {
                // 頭是強調色，身體是灰色
                ctx.fillStyle = (i == 0) ? "#58a6ff" : "#8b949e";
                ctx.fillRect(snake[i].x, snake[i].y, box, box);
                
                // 每個格子給個邊框，看起來比較像像素風
                ctx.strokeStyle = "#0d1117";
                ctx.strokeRect(snake[i].x, snake[i].y, box, box);
            }
        }

        function drawFood() {
            ctx.fillStyle = "#ff7b72"; // 紅色蘋果
            ctx.fillRect(food.x, food.y, box, box);
        }

        function collision(head, array) {
            for (let i = 0; i < array.length; i++) {
                if (head.x == array[i].x && head.y == array[i].y) {
                    return true;
                }
            }
            return false;
        }

        // --- 遊戲控制 ---
        function startGame() {
            if (game) clearInterval(game);
            init();
            GameUI.hide();
            d = "RIGHT"; // 預設向右跑
            appliedDir = "RIGHT";
            game = setInterval(draw, gameSpeed);
        }

        function gameOver() {
            clearInterval(game);
            isGameOver = true;
            // 儲存最高分 (雙重保險)
            if (score > localStorage.getItem('snakeHighScore')) {
                localStorage.setItem('snakeHighScore', score);
            }
            GameUI.show({
                title: 'GAME OVER',
                sub: '撞到牆壁或自己了',
                stats: `得分 ${score} · 最高分 ${highScore}`,
                button: '再玩一次',
                onButton: startGame
            });
        }

        function winGame() {
            clearInterval(game);
            isGameOver = true;
            if (score > localStorage.getItem('snakeHighScore')) {
                localStorage.setItem('snakeHighScore', score);
            }
            GameUI.show({
                title: 'YOU WIN! 🎉',
                sub: '完美通關，整個棋盤都是你的',
                stats: `得分 ${score}`,
                button: '再玩一次',
                onButton: startGame
            });
        }

        function togglePause() {
            if (isGameOver || (GameUI.isVisible && !isPaused)) return;

            isPaused = !isPaused;
            if (isPaused) {
                GameUI.show({
                    title: 'PAUSED',
                    sub: '經典貪食蛇',
                    stats: `目前得分 ${score} · 等級 ${level}`,
                    button: '繼續遊戲',
                    onButton: togglePause
                });
            } else {
                GameUI.hide();
            }
        }

        // 切換分頁/縮小視窗時自動暫停 (方便上班偷閒被打斷時不會暴斃)
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && !isGameOver && !isPaused && !GameUI.isVisible) {
                togglePause();
            }
        });

        // 頁面載入時：先畫好初始畫面，再蓋上遊戲首頁
        init();
        showStartScreen();

    </script>
</body>
</html>
