<!DOCTYPE html>
<html lang="zh-Hant">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

    <!-- SEO 優化 -->
    <meta name="description" content="用瀏覽器就能玩的 Flappy Bird，點擊或空白鍵讓小鳥振翅穿過水管，支援手機觸控。">
    <meta property="og:title" content="Flappy Bird | Arcade">
    <meta property="og:description" content="Rowan Tsai 休憩區內建的網頁版 Flappy Bird 小遊戲。">
    <meta property="og:image" content="images/profile.jpg">
    <link rel="canonical" href="https://junrongtsai.github.io/flappy.html">

    <title>Flappy Bird | Arcade</title>

    <meta name="theme-color" content="#0d1117">
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%230d1117'/%3E%3Ctext x='32' y='45' font-family='Arial,Helvetica,sans-serif' font-weight='800' font-size='34' fill='%2358a6ff' text-anchor='middle'%3ER%3C/text%3E%3C/svg%3E">

    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- 引入獨立的 CSS (共用主站變數系統與遊戲覆蓋層) -->
    <link rel="stylesheet" href="style.css">
    <style>
        * { margin: 0; padding: 0; user-select: none; }

        body {
            background-color: #000;
            color: var(--text-main);
            font-family: 'Segoe UI', 'Microsoft JhengHei', sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            overflow: hidden;
        }

        .game-shell { display: flex; flex-direction: column; align-items: center; gap: 12px; }

        .score-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 20px;
            width: 100%;
            background: var(--bg-color);
            border: 2px solid var(--border);
            border-radius: 8px;
            padding: 8px 16px;
        }
        .score-box { text-align: center; }
        .score-label { font-size: 0.7rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
        .score-value { font-size: 1.25rem; font-weight: bold; font-variant-numeric: tabular-nums; }
        #best { color: gold; }

        canvas {
            display: block;
            background: #0d1117;
            border: 2px solid var(--border);
            border-radius: 8px;
            box-shadow: 0 0 30px rgba(88, 166, 255, 0.15);
            touch-action: manipulation;
            cursor: pointer;
        }

        .hint { font-size: 0.78rem; color: var(--text-muted); }
        @media (max-width: 768px) { .hint { display: none; } }
    </style>

    <!-- 訪客統計 (GoatCounter，不使用 cookie) -->
    <script data-goatcounter="https://rowantsai.goatcounter.com/count" async src="//gc.zgo.at/count.js"></script>
</head>
<body>

    <div class="game-shell">
        <div class="score-bar">
            <div class="score-box">
                <div class="score-label">Score</div>
                <div class="score-value" id="score">0</div>
            </div>
            <div class="score-box">
                <div class="score-label">Best</div>
                <div class="score-value" id="best">0</div>
            </div>
        </div>

        <canvas id="game" width="380" height="520"></canvas>
        <div class="hint">點擊畫面或按空白鍵振翅 · P 暫停</div>
    </div>

    <!-- 共用覆蓋層 (開始 / 結束 / 暫停) -->
    <div class="game-overlay" id="game-overlay">
        <div class="overlay-title" id="overlay-title">FLAPPY BIRD</div>
        <div class="overlay-sub" id="overlay-sub"></div>
        <div class="overlay-stats" id="overlay-stats"></div>
        <button class="overlay-btn" id="overlay-btn">開始遊戲</button>
        <div class="overlay-controls hidden" id="overlay-controls">
            <div><span class="key">Space</span> / 點擊畫面 振翅</div>
            <div><span class="key">P</span> 暫停</div>
            <div>穿過水管縫隙得分，碰到水管或地面就結束</div>
        </div>
    </div>

    <script src="game-ui.js"></script>
    <script>
        const canvas = document.getElementById('game');
        const ctx = canvas.getContext('2d');
        const scoreEl = document.getElementById('score');
        const bestEl = document.getElementById('best');

        const W = canvas.width, H = canvas.height;
        const GROUND_H = 56;
        const FLOOR = H - GROUND_H;

        // 物理參數 (以 60fps 為基準，實際會依 delta time 縮放)
        const GRAVITY = 0.42;
        const FLAP = -7.2;
        const PIPE_W = 62;
        const PIPE_GAP = 158;
        const PIPE_SPEED = 2.5;
        const PIPE_SPACING = 210;   // 兩根水管之間的水平距離

        const BIRD_X = 96, BIRD_R = 13;

        let bird, pipes, score, best, groundOffset;
        let running = false, dead = false, isPaused = false;
        let rafId = null, lastTime = 0, spawnDistance = 0;

        best = Number(localStorage.getItem('flappyBest')) || 0;
        bestEl.textContent = best;

        function resetState() {
            bird = { y: FLOOR / 2, v: 0, rot: 0 };
            pipes = [];
            score = 0;
            groundOffset = 0;
            spawnDistance = PIPE_SPACING;   // 開局先給一段緩衝再出現第一根水管
            dead = false;
            isPaused = false;
            scoreEl.textContent = '0';
        }

        function startGame() {
            resetState();
            GameUI.hide();
            running = true;
            lastTime = performance.now();
            loop(lastTime);
        }

        function flap() {
            if (!running || isPaused || dead) return;
            bird.v = FLAP;
        }

        function spawnPipe() {
            const margin = 60;
            const gapTop = margin + Math.random() * (FLOOR - PIPE_GAP - margin * 2);
            pipes.push({ x: W, gapTop, passed: false });
        }

        function update(step) {
            // 小鳥
            bird.v += GRAVITY * step;
            bird.y += bird.v * step;
            // 依垂直速度傾斜，給一點手感回饋
            bird.rot = Math.max(-0.5, Math.min(1.2, bird.v / 12));

            // 水管
            const dx = PIPE_SPEED * step;
            spawnDistance += dx;
            if (spawnDistance >= PIPE_SPACING) {
                spawnDistance -= PIPE_SPACING;
                spawnPipe();
            }
            for (const p of pipes) {
                p.x -= dx;
                if (!p.passed && p.x + PIPE_W < BIRD_X - BIRD_R) {
                    p.passed = true;
                    score++;
                    scoreEl.textContent = score;
                }
            }
            while (pipes.length && pipes[0].x + PIPE_W < -10) pipes.shift();

            groundOffset = (groundOffset + dx) % 24;

            // 碰撞：天花板不致命但會被擋住，地面與水管則結束遊戲
            if (bird.y - BIRD_R < 0) { bird.y = BIRD_R; bird.v = 0; }
            if (bird.y + BIRD_R >= FLOOR) { bird.y = FLOOR - BIRD_R; endGame(); return; }

            for (const p of pipes) {
                const inX = BIRD_X + BIRD_R > p.x && BIRD_X - BIRD_R < p.x + PIPE_W;
                if (!inX) continue;
                const inGap = bird.y - BIRD_R > p.gapTop && bird.y + BIRD_R < p.gapTop + PIPE_GAP;
                if (!inGap) { endGame(); return; }
            }
        }

        function draw() {
            // 背景
            const sky = ctx.createLinearGradient(0, 0, 0, FLOOR);
            sky.addColorStop(0, '#111c2b');
            sky.addColorStop(1, '#0d1117');
            ctx.fillStyle = sky;
            ctx.fillRect(0, 0, W, FLOOR);

            // 水管
            for (const p of pipes) {
                drawPipe(p.x, 0, p.gapTop);                        // 上方
                drawPipe(p.x, p.gapTop + PIPE_GAP, FLOOR - (p.gapTop + PIPE_GAP)); // 下方
            }

            // 地面
            ctx.fillStyle = '#161b22';
            ctx.fillRect(0, FLOOR, W, GROUND_H);
            ctx.strokeStyle = 'rgba(88, 166, 255, 0.35)';
            ctx.lineWidth = 2;
            ctx.beginPath(); ctx.moveTo(0, FLOOR + 1); ctx.lineTo(W, FLOOR + 1); ctx.stroke();
            ctx.strokeStyle = 'rgba(255,255,255,0.06)';
            ctx.lineWidth = 8;
            for (let x = -groundOffset; x < W; x += 24) {
                ctx.beginPath();
                ctx.moveTo(x, FLOOR + 14);
                ctx.lineTo(x + 10, FLOOR + GROUND_H);
                ctx.stroke();
            }

            drawBird();

            // 分數 (畫在畫布上，落地時才看得清楚)
            ctx.fillStyle = 'rgba(240, 246, 252, 0.92)';
            ctx.font = 'bold 42px "Segoe UI", sans-serif';
            ctx.textAlign = 'center';
            ctx.fillText(score, W / 2, 62);
        }

        function drawPipe(x, y, h) {
            if (h <= 0) return;
            const grad = ctx.createLinearGradient(x, 0, x + PIPE_W, 0);
            grad.addColorStop(0, '#2f6f4f');
            grad.addColorStop(0.45, '#3fb950');
            grad.addColorStop(1, '#2a5f45');
            ctx.fillStyle = grad;
            ctx.fillRect(x, y, PIPE_W, h);
            // 管口
            ctx.fillStyle = '#46c95c';
            const lipY = y === 0 ? y + h - 16 : y;
            ctx.fillRect(x - 4, lipY, PIPE_W + 8, 16);
            ctx.strokeStyle = 'rgba(0,0,0,0.35)';
            ctx.lineWidth = 2;
            ctx.strokeRect(x, y, PIPE_W, h);
        }

        function drawBird() {
            ctx.save();
            ctx.translate(BIRD_X, bird.y);
            ctx.rotate(bird.rot);

            ctx.fillStyle = '#ffd166';
            ctx.beginPath();
            ctx.arc(0, 0, BIRD_R, 0, Math.PI * 2);
            ctx.fill();
            ctx.strokeStyle = '#b98a1e';
            ctx.lineWidth = 2;
            ctx.stroke();

            // 翅膀 (依速度上下擺動)
            ctx.fillStyle = '#f0a92e';
            ctx.beginPath();
            ctx.ellipse(-3, bird.v < 0 ? -3 : 3, 7, 4.5, 0, 0, Math.PI * 2);
            ctx.fill();

            // 眼睛與嘴
            ctx.fillStyle = '#fff';
            ctx.beginPath(); ctx.arc(5, -4, 4.2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#12151a';
            ctx.beginPath(); ctx.arc(6.5, -4, 2, 0, Math.PI * 2); ctx.fill();
            ctx.fillStyle = '#ff8a3d';
            ctx.beginPath();
            ctx.moveTo(BIRD_R - 2, 1); ctx.lineTo(BIRD_R + 7, 4); ctx.lineTo(BIRD_R - 2, 7);
            ctx.closePath(); ctx.fill();

            ctx.restore();
        }

        function loop(now) {
            if (!running || isPaused) return;
            // 依實際經過時間縮放，換算成 60fps 的步進量；夾住上限避免掉幀時瞬移穿牆
            const step = Math.min((now - lastTime) / 16.667, 2.5);
            lastTime = now;
            update(step);
            if (!running) return;   // update 內可能已結束遊戲
            draw();
            rafId = requestAnimationFrame(loop);
        }

        function stopLoop() {
            if (rafId) cancelAnimationFrame(rafId);
            rafId = null;
        }

        function endGame() {
            running = false;
            dead = true;
            stopLoop();
            draw();

            let stats = `得分 ${score}`;
            if (score > best) {
                best = score;
                localStorage.setItem('flappyBest', best);
                bestEl.textContent = best;
                stats += '（新紀錄！）';
            } else {
                stats += ` · 最佳 ${best}`;
            }
            GameUI.show({
                title: 'GAME OVER',
                sub: 'Flappy Bird',
                stats,
                button: '再玩一次',
                controls: false,
                onButton: startGame
            });
        }

        function togglePause() {
            if (!running || dead) return;
            isPaused = !isPaused;
            if (isPaused) {
                stopLoop();
                GameUI.show({
                    title: 'PAUSED',
                    sub: 'Flappy Bird',
                    stats: `目前得分 ${score}`,
                    button: '繼續遊戲',
                    controls: false,
                    onButton: togglePause
                });
            } else {
                GameUI.hide();
                lastTime = performance.now();   // 不把暫停的時間算進物理步進
                loop(lastTime);
            }
        }

        function showStartScreen() {
            GameUI.show({
                title: 'FLAPPY BIRD',
                sub: '穿過水管，別掉下去',
                stats: best ? `最佳紀錄 ${best} 分` : '',
                button: '開始遊戲',
                controls: true,
                onButton: startGame
            });
        }

        // --- 輸入 ---
        document.addEventListener('keydown', (e) => {
            if (e.key === 'p' || e.key === 'P') { if (!e.repeat) togglePause(); return; }
            if (e.code === 'Space' || e.key === 'ArrowUp') {
                e.preventDefault();
                if (!GameUI.isVisible) flap();   // 覆蓋層顯示時 Space 由 GameUI 處理 (開始/重來)
            }
        });

        canvas.addEventListener('pointerdown', (e) => { e.preventDefault(); flap(); });

        // 切換分頁時自動暫停，回來不會已經摔死
        document.addEventListener('visibilitychange', () => {
            if (document.hidden && running && !isPaused && !dead) togglePause();
        });

        resetState();
        draw();
        showStartScreen();
    </script>
</body>
</html>
